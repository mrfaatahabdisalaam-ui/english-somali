<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin • English Somali</title>
<link rel="stylesheet" href="style.css">

<style>
.admin{max-width:900px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:15px;border-radius:15px;background:#101c2d;border:1px solid rgba(255,255,255,.06)}
.stat b{font-size:25px;display:block}
.pay{padding:13px;border-radius:15px;background:#101c2d;border:1px solid rgba(255,255,255,.06);margin:8px 0}
.pay button{width:auto;margin-right:6px}
.danger{background:#40202a!important;color:#ffdce2!important}
.success{background:#55d6ff!important}
.hint{font-size:12px;color:#91a1b8;line-height:1.5}
.lesson-admin{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-radius:13px;background:#101c2d;margin:7px 0}

.subtitle-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.subtitle-actions button{width:auto}

.subtitle-head,
.subtitle-row{
  display:grid;
  grid-template-columns:90px 90px 1fr 1fr 45px;
  gap:8px;
  align-items:center;
}

.subtitle-head{
  margin-top:14px;
  font-size:12px;
  color:#91a1b8;
}

#subtitleRows{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:8px;
}

.subtitle-row input{min-width:0}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .subtitle-head{display:none}
  .subtitle-row{grid-template-columns:1fr 1fr}
  .subtitle-row .sub-en,
  .subtitle-row .sub-so{grid-column:span 2}
  .subtitle-row .edit-remove{grid-column:span 2}
}
</style>
</head>

<body>

<main class="admin">

<header>
<b>🛠️ Admin Dashboard</b>
<button id="out" class="ghost hidden">Ka bax</button>
</header>

<section id="login" class="card">
<h2>Admin Login</h2>
<input id="adminId" type="text" placeholder="Geli Admin ID-gaaga">
<input id="adminPassword" type="password" placeholder="Admin Password">
<button id="loginBtn">Gali Admin</button>
</section>

<section id="dash" class="hidden">

<div id="stats" class="grid"></div>

<form id="lessonForm" class="card">

<h2>➕ Soo geli cashar cusub</h2>

<input id="title" placeholder="Cinwaanka casharka" required>

<input id="desc" placeholder="Sharaxaad">

<input id="video" type="file" accept="video/*">

<div class="subtitle-actions">

<button id="aiSubtitleBtn" type="button">
🤖 AI Subtitle Samee
</button>

<button id="addSubtitle" type="button" class="ghost">
➕ Subtitle ku dar
</button>

</div>

<p id="uploadStatus" class="hint">
Video dooro. AI-ga wuxuu sameyn doonaa English + timestamps.
</p>

<div class="subtitle-head">
<span>Start</span>
<span>End</span>
<span>English</span>
<span>Somali</span>
<span></span>
</div>

<div id="subtitleRows"></div>

<textarea id="lines" style="display:none"></textarea>

<button id="publish" type="submit">
🚀 Publish
</button>

<p id="msg" class="hint"></p>

</form>

<div class="card">
<h2>💳 Payment requests</h2>
<div id="payments"></div>
</div>

<div class="card">
<h2>🎬 Casharrada la daabacay</h2>
<div id="lessonList"></div>
</div>

</section>

</main>

<script src="app.js"></script>
<script src="admin.js"></script>

</body>
</html>
