<!doctype html><html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • English Somali</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:900px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border-radius:15px;background:#101c2d;border:1px solid rgba(255,255,255,.06)}.stat b{font-size:25px;display:block}.pay{padding:13px;border-radius:15px;background:#101c2d;border:1px solid rgba(255,255,255,.06);margin:8px 0}.pay button{width:auto;margin-right:6px}.danger{background:#40202a!important;color:#ffdce2!important}.success{background:#55d6ff!important}.hint{font-size:12px;color:#91a1b8;line-height:1.5}.lesson-admin{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-radius:13px;background:#101c2d;margin:7px 0}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}code{color:#55d6ff}</style></head><body><main class="admin"><header><b>🛠️ Admin Dashboard</b><button id="out" class="ghost hidden">Ka bax</button></header><section id="login" class="card"><h2>Admin Login</h2><input id="pass" type="password" placeholder="Admin password"><button id="loginBtn">Gali Admin</button></section><section id="dash" class="hidden"><div id="stats" class="grid"></div><div class="card"><h2>➕ Soo geli cashar cusub</h2><input id="title" placeholder="Cinwaanka casharka"><input id="desc" placeholder="Sharaxaad"><input id="video" type="file" accept="video/*"><textarea id="lines" rows="14" placeholder='[\n {"start":0,"end":4,"en":"Listen to English podcasts.","so":"Dhageyso barnaamijyada codka ah ee Ingiriisiga."}\n]'></textarea><p class="hint">Waqtiyada <code>start/end</code> waa ilbiriqsiyo. Waxaad isticmaali kartaa subtitles-ka aad horey u diyaarisay. Video-ga laftiisa ayaa xambaarsan codka.</p><button id="publish">🚀 Publish</button><p id="msg" class="hint"></p></div><div class="card"><h2>💳 Payment requests</h2><div id="payments"></div></div><div class="card"><h2>🎬 Casharrada la daabacay</h2><div id="lessonList"></div></div></section></main><script src="admin.js"></script></body></html>
